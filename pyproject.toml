[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web51tnc"
version = "1.3.1"
description = "Modern Web UI & APRS Gateway Controller for NET-51TNC hardware TNC/iGate"
readme = "README.md"
authors = [
    { name = "Mikko / OH2FXD", email = "oh2fxd@sral.fi" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "websockets>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/oh2fxd/web51tnc"
Documentation = "https://github.com/oh2fxd/web51tnc#readme"
Repository = "https://github.com/oh2fxd/web51tnc.git"
Issues = "https://github.com/oh2fxd/web51tnc/issues"

[project.scripts]
web51tnc = "server:main"

[tool.setuptools]
py-modules = ["net51tnc_protocol", "server"]
include-package-data = true

[tool.setuptools.data-files]
"static" = [
    "static/index.html",
    "static/app.js",
    "static/style.css",
]
"static/vendor/leaflet" = [
    "static/vendor/leaflet/leaflet.js",
    "static/vendor/leaflet/leaflet.css",
    "static/vendor/leaflet/LICENSE",
]
"static/vendor/leaflet/images" = [
    "static/vendor/leaflet/images/layers.png",
    "static/vendor/leaflet/images/layers-2x.png",
    "static/vendor/leaflet/images/marker-icon.png",
    "static/vendor/leaflet/images/marker-icon-2x.png",
    "static/vendor/leaflet/images/marker-shadow.png",
]
